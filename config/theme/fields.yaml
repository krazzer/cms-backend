content:
    label_trans: section_fields.content
    type: richtext
    field: content.*.content
text:
    label_trans: section_fields.text
    type: richtext
    field: content.*.text
image:
    label_trans: section_fields.image
    type: image
    field: content.image
form:
    label_trans: section_fields.form
    type: select
    field: content.form
    item_provider: form_options
title:
    type: text
    field: name.*
    label_trans: general.name
    validator:
        name: presence
sections:
    type: datatable
    label: general.content
    instance: page_content
gallery:
    type: datatable
    label_trans: fields.gallery
    field: content.gallery
    instance: page_images