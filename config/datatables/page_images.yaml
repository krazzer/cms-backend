buttons:
    add:
        label: datatables.page_images.button.add
    delete: ~
headers:
    id: general.id
    image_id: general.image
    name: general.name
cells:
    image_id:
        type: image
mobile_columns:
    - image_id
form:
    fields:
        name:
            type: text
            label: general.name
        description:
            type: text
            label: general.description
        image_id:
            type: filepicker
            label: general.image
            validator:
                name: presence
rearrange: true
source:
    type: local